# Expose immutable /usr/libexec/sol-os binaries in /usr/local/bin via OSTree's /var/usrlocal
d /var/usrlocal/bin 0755 root root -
L+ /var/usrlocal/bin/cyan-skillfish-governor-smu - - - - /usr/libexec/sol-os/cyan-skillfish-governor-smu
L+ /var/usrlocal/bin/sol-helixsr-setup - - - - /usr/libexec/sol-os/sol-helixsr-setup
L+ /var/usrlocal/bin/helixsr-update - - - - /usr/libexec/sol-os/helixsr-update
L+ /var/usrlocal/bin/sol-theme-apply - - - - /usr/libexec/sol-os/sol-theme-apply
L+ /var/usrlocal/bin/sol-media-setup - - - - /usr/libexec/sol-os/sol-media-setup
L+ /var/usrlocal/bin/sol-media-mode - - - - /usr/libexec/sol-os/sol-media-mode
L+ /var/usrlocal/bin/sol-cu-manager - - - - /usr/libexec/sol-os/bc250-cu-live-manager
L /var/usrlocal/bin/bc250-cu-live-manager - - - - /usr/libexec/sol-os/bc250-cu-live-manager
