# Sol OS (BC-250 Edition) — Tuned mpv defaults for AMD BC-250 (Cyan Skillfish)
#
# Note: The BC-250 APU has VCN hardware video decode permanently eFused off in
# silicon. Do not set hwdec=vaapi (probing fails and slows startup) and do not
# override vo= here so Plex HTPC can render through its embedded Qt OpenGL path.

# Multi-threaded Zen 2 AVX2 software decoding (uses all 12 hardware threads)
hwdec=no
vd-lavc-threads=0
vd-lavc-dr=yes

# Smooth frame pacing for 23.976 / 24 / 60 fps film and TV playback
video-sync=display-resample
interpolation=no

# Generous network demuxer cache for high-bitrate 4K Direct Play streams
cache=yes
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=128MiB
demuxer-readahead-secs=30

# RDNA 2 GPU-accelerated HDR-to-SDR tone-mapping
tone-mapping=bt.2446a
hdr-compute-peak=no
dither-depth=auto
