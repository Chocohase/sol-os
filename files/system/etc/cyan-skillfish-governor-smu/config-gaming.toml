# Sol OS (BC-250 Edition) — AMD BC-250 (Cyan Skillfish) GPU SMU Governor Configuration
#
# Defaults are intentionally conservative for out-of-the-box stability across
# diverse BC-250 silicon bins:
#   - Frequency ceiling is capped at 2000 MHz.
#   - Safe voltage floor is kept at 950–1000 mV to prevent GPU silicon lockups
#     and hard hangs under transient shader loads.
#
# After modifying this file, restart the governor service to apply changes:
#   sudo systemctl restart cyan-skillfish-governor-smu.service

[timing.intervals]
sample = 500
adjust = 200_000

[timing.ramp-rates]
normal = 1
burst = 50

[timing]
burst-samples = 60
down-events = 5

[frequency-thresholds]
adjust = 10

[load-target]
upper = 0.80
lower = 0.65

[temperature]
throttling = 85
throttling_recovery = 80

[[safe-points]]
frequency = 1000
voltage = 950

[[safe-points]]
frequency = 1500
voltage = 975

[[safe-points]]
frequency = 2000
voltage = 1000
