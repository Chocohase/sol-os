# Sol OS (BC-250 Edition) — Keep DisplayPort-to-HDMI audio sinks awake
# Prevents 1-2s TV/AVR audio drops on media pause/resume and menu navigation.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        "session.suspend-timeout-seconds" = 0
      }
    }
  }
]
