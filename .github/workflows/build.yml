name: Build Sol OS

on:
  push:
    branches:
      - main
  schedule:
    # Weekly rebuild every Sunday at 04:00 UTC to pick up upstream Bazzite & Fedora updates
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Generate bootable sol-os.iso artifact after image build"
        required: false
        default: true
        type: boolean
      image_tag:
        description: "OCI image tag to bundle into sol-os.iso"
        required: false
        default: "latest"
        type: string

jobs:
  build:
    name: Build & Sign Sol OS OCI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and sign Sol OS image with BlueBuild
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

  generate-iso:
    name: Generate Bootable sol-os.iso
    if: github.event_name == 'workflow_dispatch' && inputs.build_iso
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h

      - name: Install BlueBuild CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/blue-build/cli/main/install.sh | bash
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Log in to GitHub Container Registry (Docker)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (Docker & Podman for root)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if command -v docker >/dev/null 2>&1; then
            printf '%s\n' "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            printf '%s\n' "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi
          if command -v podman >/dev/null 2>&1; then
            printf '%s\n' "${GHCR_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            printf '%s\n' "${GHCR_TOKEN}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

      - name: Generate bootable sol-os.iso
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          export PATH="${HOME}/.local/bin:${HOME}/.cargo/bin:${PATH}"
          OWNER_LC="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          mkdir -p iso-output
          sudo "$(command -v bluebuild)" generate-iso \
            --variant server \
            --output-dir ./iso-output \
            --iso-name sol-os.iso \
            image "ghcr.io/${OWNER_LC}/sol-os:${IMAGE_TAG}"
          (cd iso-output && sha256sum sol-os.iso > sol-os.iso.sha256)
          sudo chown -R "$(id -u):$(id -g)" iso-output
          ls -lh iso-output

      - name: Upload sol-os.iso artifact
        uses: actions/upload-artifact@v4
        with:
          name: sol-os-iso
          path: |
            iso-output/sol-os.iso
            iso-output/sol-os.iso.sha256
          retention-days: 7
