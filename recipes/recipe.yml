# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: sol-os
description: "Sol OS (BC-250 Edition) — Immutable SteamOS-like Linux OS for the AMD BC-250 APU (Oberon / Cyan Skillfish GFX1013) with out-of-the-box HelixSR RDNA 2 FP16 upscaling."
base-image: ghcr.io/ublue-os/bazzite-deck
image-version: latest

stages:
  - name: bc250-governor-builder
    from: ghcr.io/ublue-os/bazzite-deck:latest
    modules:
      - type: script
        scripts:
          - install-bc250-governor.sh

  - name: sol-theme-builder
    from: ghcr.io/ublue-os/bazzite-deck:latest
    modules:
      - type: files
        files:
          - source: system
            destination: /
      - type: script
        scripts:
          - build-theme-assets.sh

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: copy
    from: bc250-governor-builder
    src: /out/usr/libexec/sol-os/cyan-skillfish-governor-smu
    dest: /usr/libexec/sol-os/cyan-skillfish-governor-smu

  - type: copy
    from: sol-theme-builder
    src: /out/usr/share/plymouth/themes/sol-eclipse
    dest: /usr/share/plymouth/themes/sol-eclipse

  - type: copy
    from: sol-theme-builder
    src: /out/usr/share/sol-os/theme/sol_startup.webm
    dest: /usr/share/sol-os/theme/sol_startup.webm

  - type: copy
    from: sol-theme-builder
    src: /out/usr/share/sol-os/theme/css-loader/Sol-Eclipse/backdrop.jpg
    dest: /usr/share/sol-os/theme/css-loader/Sol-Eclipse/backdrop.jpg

  - type: copy
    from: sol-theme-builder
    src: /out/usr/share/plasma/look-and-feel/org.sol-os.eclipse/contents/splash/images/eclipse.png
    dest: /usr/share/plasma/look-and-feel/org.sol-os.eclipse/contents/splash/images/eclipse.png

  - type: copy
    from: sol-theme-builder
    src: /out/usr/share/pixmaps/sol-os-logo.png
    dest: /usr/share/pixmaps/sol-os-logo.png

  - type: copy
    from: sol-theme-builder
    src: /out/usr/share/icons/hicolor/256x256/apps/sol-os-logo.png
    dest: /usr/share/icons/hicolor/256x256/apps/sol-os-logo.png

  - type: copy
    from: sol-theme-builder
    src: /out/usr/share/icons/hicolor/512x512/apps/sol-os-logo.png
    dest: /usr/share/icons/hicolor/512x512/apps/sol-os-logo.png

  - type: dnf
    # Official Fedora repos are kept as default for reliable CI builds.
    # amdgpu_top can optionally be layered via COPR if preferred over radeontop.
    # Note: bazzite-deck:latest already preinstalls patched terra-gamescope and
    # terra-mangohud, which conflict with stock Fedora gamescope/mangohud RPMs.
    install:
      packages:
        - lm_sensors
        - git
        - curl
        - unzip
        - jq
        - vulkan-tools
        - radeontop

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - tv.plex.PlexHTPC
          - io.mpv.Mpv

  - type: script
    scripts:
      - configure-branding.sh
      - configure-theme.sh
      - stage-helixsr.sh

  - type: systemd
    system:
      enabled:
        - sol-grow-root.service
        - cyan-skillfish-governor-smu.service
        - plugin_loader.service
      masked:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target
        - hhd.service
        - hhd@.service
    user:
      enabled:
        - sol-helixsr-setup.service
        - sol-theme-setup.service
        - sol-media-setup.service

  - type: kargs
    arch: x86_64
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      # Optional Zen 2 performance gain at the cost of CPU side-channel mitigations.
      # Uncomment only if you accept the reduced side-channel security trade-off:
      # - mitigations=off

  - type: initramfs

  - type: signing
